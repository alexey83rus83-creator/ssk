<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чек-лист: Новое в безопасности-2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .card {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
            padding: 28px 28px 32px;
            border: 1px solid #d5dfe6;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #0a1a2b;
            letter-spacing: -0.3px;
            padding-bottom: 14px;
            border-bottom: 3px solid #1a3a5c;
            margin-bottom: 20px;
        }
        .card-title span {
            background: #1a3a5c;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 30px;
            margin-left: 12px;
            display: inline-block;
            vertical-align: middle;
        }

        .subtitle {
            font-size: 14px;
            color: #4a5f73;
            margin-bottom: 18px;
            padding-left: 4px;
        }

        .checklist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .checklist li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 8px 10px 4px;
            font-size: 15px;
            line-height: 1.45;
            color: #0a1a2b;
            border-bottom: 1px solid #e8eef2;
            transition: background 0.1s;
        }
        .checklist li:last-child {
            border-bottom: none;
        }
        .checklist li:hover {
            background: #f4f8fa;
        }

        .checklist input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
            accent-color: #1a3a5c;
            cursor: pointer;
        }

        .checklist .label {
            flex: 1;
        }

        .checklist .label strong {
            color: #0a1a2b;
        }

        .footer-note {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #dce6ed;
            display: flex;
            justify-content: flex-end;
            font-size: 13px;
            color: #5a7373;
        }

        @media (max-width: 600px) {
            .card {
                padding: 16px 14px;
            }
            .card-title {
                font-size: 17px;
            }
            .checklist li {
                font-size: 14px;
                padding: 8px 4px;
            }
        }

        @media print {
            .card {
                box-shadow: none;
                border: 1px solid #aaa;
            }
            .checklist input[type="checkbox"] {
                accent-color: #000;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-title">
        Чек-лист для ответственного
        <span>2026</span>
    </div>
    <div class="subtitle">Новое в безопасности учреждений культуры</div>

    <ul class="checklist">
        <li>
            <input type="checkbox" id="cl1">
            <label for="cl1" class="label">Пересмотреть мероприятия по антитеррору с учётом муниципальных программ на 2026–2030 годы</label>
        </li>
        <li>
            <input type="checkbox" id="cl2">
            <label for="cl2" class="label">Установить усиленный контроль за работниками из новых субъектов (ДНР, ЛНР, Запорожская и Херсонская области)</label>
        </li>
        <li>
            <input type="checkbox" id="cl3">
            <label for="cl3" class="label">Проводить регулярные беседы с сотрудниками из групп риска, обращать внимание на изменения в поведении</label>
        </li>
        <li>
            <input type="checkbox" id="cl4">
            <label for="cl4" class="label">Мониторить рабочие чаты на наличие призывов к незаконным действиям, агрессии, интереса к террористическим организациям</label>
        </li>
        <li>
            <input type="checkbox" id="cl5">
            <label for="cl5" class="label">Проверить наличие запрещенной символики и экстремистских плакатов в помещениях учреждения</label>
        </li>
        <li>
            <input type="checkbox" id="cl6">
            <label for="cl6" class="label">Разместить информацию об ответственности за терроризм и экстремизм в зоне видимости работников и на сайте учреждения</label>
        </li>
        <li>
            <input type="checkbox" id="cl7">
            <label for="cl7" class="label">Довести до сведения работников изменения: снижение возраста уголовной ответственности до 14 лет, ответственность организатора за всех участников, пожизненный срок за вовлечение несовершеннолетних</label>
        </li>
        <li>
            <input type="checkbox" id="cl8">
            <label for="cl8" class="label">Включить в инструктажи по ГО и ЧС порядок действий при сигнале «Ракетная опасность» (вопрос 5 тематического плана)</label>
        </li>
        <li>
            <input type="checkbox" id="cl9">
            <label for="cl9" class="label">Запросить выписку из плана гражданской обороны муниципального образования (если не предоставлена)</label>
        </li>
        <li>
            <input type="checkbox" id="cl10">
            <label for="cl10" class="label">Подготовить и утвердить памятки для сотрудников по действиям при сигнале «Ракетная опасность»</label>
        </li>
    </ul>

    <div class="footer-note">
        <span>Антитеррор и ГО — 2026</span>
    </div>
</div>

<script>
    document.querySelectorAll('.checklist input[type="checkbox"]').forEach((cb, index) => {
        const saved = localStorage.getItem('new2026_check_' + index);
        if (saved === 'true') cb.checked = true;
        cb.addEventListener('change', function() {
            localStorage.setItem('new2026_check_' + index, this.checked);
        });
    });
</script>

</body>
</html>
